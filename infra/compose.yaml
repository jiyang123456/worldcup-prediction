services:
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:7001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      BACKEND_PORT: 7001
      DATABASE_PATH: /app/backend/data/worldcup.sqlite
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
    volumes:
      - worldcup-data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:7001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  worldcup-data:
